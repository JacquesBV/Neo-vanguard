<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neo-Vanguard — L'Éveil (prototype narratif)</title><style>
*{box-sizing:border-box}body{margin:0;background:#030711;color:#f3f7ff;font-family:system-ui,Arial,sans-serif;overflow:hidden}.scene{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,#163153 0%,#070b1a 46%,#02040b 100%)}.stars{position:absolute;inset:-20%;background-image:radial-gradient(1px 1px at 8% 16%,#fff 99%,transparent),radial-gradient(2px 2px at 30% 70%,#b8d9ff 99%,transparent),radial-gradient(1px 1px at 73% 29%,#fff 99%,transparent),radial-gradient(2px 2px at 91% 85%,#b8d9ff 99%,transparent);background-size:270px 230px;animation:drift 28s linear infinite}.planet{width:min(64vw,420px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 25%,#9ce9c9,#3b83bd 42%,#1d3567 70%,#101526);box-shadow:0 0 75px #2888e455, inset -45px -20px 60px #0009;animation:breathe 7s ease-in-out infinite}.scene[data-scene="3"] .planet,.scene[data-scene="4"] .planet{filter:grayscale(1)}.scene[data-scene="3"]{background:radial-gradient(ellipse,#47131b,#07030a 70%)}.scene[data-scene="3"] .planet{box-shadow:0 0 90px #ff253744}.scene[data-scene="0"] .planet,.scene[data-scene="1"] .planet,.scene[data-scene="5"] .planet,.scene[data-scene="6"] .planet{opacity:.12}.sector-art{position:absolute;inset:8% 8% 24%;background:url("assets/media/briefings/secteur-01.webp") center/contain no-repeat;opacity:0;transform:scale(1);transition:opacity 1s ease,transform 7s ease;filter:drop-shadow(0 0 22px #48c6ff55)}.scene[data-scene="6"] .sector-art{opacity:.82;transform:scale(1.08)}.vorax-art{position:absolute;inset:10% 10% 26%;background:url("assets/media/Neo-Vanguard_intro_VORAX.png") center/contain no-repeat;opacity:0;transform:scale(.84);transition:opacity 1s ease,transform 7s ease;filter:drop-shadow(0 0 24px #e0203d99)}.scene[data-scene="3"] .vorax-art{opacity:1;transform:scale(1.04)}.scene[data-scene="3"] .planet{opacity:.08}.scene[data-scene="3"] .eyes{display:none!important}.eyes{position:absolute;display:none;top:37%;gap:85px}.eyes i{width:38px;height:12px;background:#ff1d30;border-radius:70%;box-shadow:0 0 20px 10px #ff1b3b99}.scene[data-scene="3"] .eyes{display:flex}.cockpit{position:absolute;bottom:-14vh;width:110vw;height:38vh;border:4px solid #5e8ab9;border-radius:50% 50% 0 0;box-shadow:0 0 45px #5da9fc44,inset 0 0 40px #5da9fc44;display:none}.scene[data-scene="1"] .cockpit,.scene[data-scene="4"] .cockpit,.scene[data-scene="5"] .cockpit{display:block}.veil{position:absolute;inset:0;background:linear-gradient(transparent 50%,#0008)}.card{position:absolute;bottom:12vh;left:5vw;right:5vw;text-align:center;max-width:820px;margin:auto;text-shadow:0 2px 12px #000}.speaker{color:#6df2ff;text-transform:uppercase;letter-spacing:.22em;font-size:.78rem;font-weight:800}.line{font-size:clamp(1.3rem,3.2vw,2.25rem);font-weight:650;line-height:1.35;min-height:3em}.controls{position:fixed;bottom:2vh;left:0;right:0;display:flex;justify-content:center;gap:12px;align-items:center}.controls button{background:#0c223b;color:white;border:1px solid #6dd8f5;border-radius:9px;padding:10px 18px;cursor:pointer}.controls button:focus-visible{outline:3px solid white}.card{transition:opacity .28s ease,transform .28s ease}.card.transitioning{opacity:0;transform:translateY(10px)}@media(max-width:480px){.controls{gap:5px;flex-wrap:wrap;padding:0 8px}.controls button{padding:8px 10px}.card{bottom:16vh}}.counter{font-size:.8rem;color:#a9b6cb}header{position:fixed;top:3vh;left:4vw;font-size:.8rem;letter-spacing:.18em;color:#9fdcf5}header strong{display:block;font-size:1.3rem;color:white} @keyframes drift{to{transform:translateY(100px)}}@keyframes breathe{50%{transform:scale(1.06)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style></head><body><main class="scene" id="scene" data-scene="0"><div class="stars"></div><div class="planet"></div><div class="sector-art" aria-hidden="true"></div><div class="vorax-art" role="img" aria-label="Vorax, antagoniste mécanique rouge"></div><div class="eyes"><i></i><i></i></div><div class="cockpit"></div><div class="veil"></div><div class="card" aria-live="polite"><div class="speaker" id="speaker"></div><p class="line" id="line"></p></div></main><header>NEO-VANGUARD<strong>L'ÉVEIL</strong></header><nav class="controls"><button id="back" aria-label="Scène précédente">◀</button><button id="toggle">Lecture ▶</button><button id="next" aria-label="Scène suivante">▶</button><button id="restart" aria-label="Recommencer la cinématique">↺ Rejouer</button><button id="sound" aria-pressed="false" title="Musique du récit">♫ Musique : non</button><span class="counter" id="count"></span></nav><script>
"use strict";
// Prototype narratif indépendant : aucune simulation de gameplay, aucun état global modifié.
const beats=[
[0,"VESTA","Est-ce que tu m'entends ?"],
[0,"VESTA","Ouvre les yeux… Je t'en prie."],
[1,"LE PILOTE","Où suis-je ?"],
[1,"VESTA","Tu es enfin revenu à toi."],
[1,"LE PILOTE","Qui êtes-vous ? Et moi… qui suis-je ?"],
[1,"VESTA","Je suis Vesta. Nous allons devoir commencer par l'essentiel."],
[2,"VESTA","Six générations de consoles sacrées préservent les couleurs et la vie de nos mondes."],
[2,"VESTA","Aujourd'hui, cet héritage est menacé."],
[3,"VESTA","Son nom est Vorax. Il veut effacer tout ce qui rend cet univers vivant."],
[3,"VESTA","Plus de couleurs. Plus de créations. Plus de souvenirs."],
[4,"LE PILOTE","Pourquoi moi ? Je ne sais même pas qui je suis."],
[4,"VESTA","Parce que tu peux encore les sauver. Certaines choses ne s'oublient jamais."],
[5,"LE PILOTE","Je ne vais pas rester là à regarder ces mondes disparaître."],
[5,"VESTA","Alors nous avons encore une chance."],
[6,"VESTA","Vingt-quatre secteurs nous séparent de Vorax. Je reste avec toi."],
[6,"LE PILOTE","Alors commençons."]
];let index=0,timer=null,transition=null;
const soundtrack=new Audio("music/story.mp3");soundtrack.loop=true;soundtrack.volume=.24;
const soundButton=document.getElementById("sound");
const scene=document.getElementById("scene"),speaker=document.getElementById("speaker"),line=document.getElementById("line"),count=document.getElementById("count"),toggle=document.getElementById("toggle"),card=document.querySelector(".card");
function syncSound(){const on=!soundtrack.paused;soundButton.textContent=on?"♫ Musique : oui":"♫ Musique : non";soundButton.setAttribute("aria-pressed",String(on))}
soundButton.addEventListener("click",async()=>{if(soundtrack.paused){try{await soundtrack.play()}catch(e){soundButton.textContent="♫ Audio indisponible";return}}else soundtrack.pause();syncSound()});
function duration(){return Math.max(3900,Math.min(8500,beats[index][2].length*63+1450))}
function draw(){const b=beats[index];scene.dataset.scene=b[0];speaker.textContent=b[1];line.textContent=b[2];count.textContent=(index+1)+" / "+beats.length}
function stop(){clearTimeout(timer);timer=null;toggle.textContent="Lecture ▶"}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>{timer=null;if(index===beats.length-1){stop();return}move(index+1,true)},duration())}
function move(to,autoplay=false){clearTimeout(timer);timer=null;clearTimeout(transition);const wasPlaying=autoplay;card.classList.add("transitioning");transition=setTimeout(()=>{index=Math.max(0,Math.min(beats.length-1,to));draw();card.classList.remove("transitioning");transition=null;if(wasPlaying)schedule()},280)}
function next(){const playing=timer!==null;move(Math.min(beats.length-1,index+1),playing)}
function prev(){const playing=timer!==null;move(Math.max(0,index-1),playing)}
function play(){if(timer){stop();return}if(index===beats.length-1){move(0,true);toggle.textContent="Pause ❚❚";return}schedule();toggle.textContent="Pause ❚❚"}
document.getElementById("back").addEventListener("click",prev);
document.getElementById("next").addEventListener("click",next);
document.getElementById("restart").addEventListener("click",()=>{stop();move(0)});
toggle.addEventListener("click",play);
document.addEventListener("keydown",e=>{if(e.target.closest("button"))return;if(e.key==="ArrowRight")next();if(e.key==="ArrowLeft")prev();if(e.key==="Escape")stop();if(e.code==="Space"){e.preventDefault();play()}});
document.addEventListener("visibilitychange",()=>{if(document.hidden){stop();soundtrack.pause();syncSound()}});
draw();
</script></body></html>
